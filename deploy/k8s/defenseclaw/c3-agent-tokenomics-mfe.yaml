apiVersion: apps/v1
kind: Deployment
metadata:
  name: c3-agent-tokenomics-mfe
  namespace: defenseclaw-tokenomics
  labels:
    app.kubernetes.io/name: c3-agent-tokenomics-mfe
    app.kubernetes.io/component: mfe
    app.kubernetes.io/part-of: defenseclaw
    demo.cisco.com/surface: c3-agent-tokenomics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c3-agent-tokenomics-mfe
      app.kubernetes.io/component: mfe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c3-agent-tokenomics-mfe
        app.kubernetes.io/component: mfe
        app.kubernetes.io/part-of: defenseclaw
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mfe
          image: 637423309390.dkr.ecr.us-east-1.amazonaws.com/defenseclaw-c3-tokenomics-mfe@sha256:5146515675cc18b53c5b20bb03c3f3bdbe179cdf06b3203eb1272622b28fd5fa
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST
              value: 0.0.0.0
            - name: MFE_PORT
              value: "3001"
            - name: API_PORT
              value: "8787"
            - name: TOKENOMICS_BFF_URL
              value: "http://c3-agent-tokenomics-demo.defenseclaw-tokenomics.svc.cluster.local:8787"
            - name: POLICY_STUDIO_BFF_TIMEOUT_MS
              value: "30000"
          ports:
            - name: web
              containerPort: 3001
            - name: api
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /
              port: web
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: c3-agent-tokenomics-mfe
  namespace: defenseclaw-tokenomics
  labels:
    app.kubernetes.io/name: c3-agent-tokenomics-mfe
    app.kubernetes.io/component: mfe
    app.kubernetes.io/part-of: defenseclaw
spec:
  type: LoadBalancer
  # The browser and API share port 80. API_PORT 8787 remains pod-internal for
  # health checks and proxy handling and is not an external Service listener.
  loadBalancerSourceRanges:
    - 0.0.0.0/0
  selector:
    app.kubernetes.io/name: c3-agent-tokenomics-mfe
    app.kubernetes.io/component: mfe
  ports:
    - name: http
      port: 80
      targetPort: web
