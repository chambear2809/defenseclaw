    BudgetPolicyInput:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          minLength: 1
          description: >-
            Concrete employee/task agent ID, or '*' for the resident
            DefenseClaw instance to enforce as a catch-all workload policy.
        agent_name:
          type: string
        session_token_budget:
          type: integer
          minimum: 1
        daily_token_budget:
          type: integer
          minimum: 1
        session_cost_budget_usd:
          type: number
          format: double
          exclusiveMinimum: 0
        daily_cost_budget_usd:
          type: number
          format: double
          exclusiveMinimum: 0
        action:
          type: string
          enum: [deny, steer]
          default: deny
        updated_by:
          type: string
        source:
          type: string
          description: local today; reserved for Galileo SaaS policy provenance later.
      anyOf:
        - required: [session_token_budget]
        - required: [daily_token_budget]
        - required: [session_cost_budget_usd]
        - required: [daily_cost_budget_usd]
    BudgetPolicy:
      allOf:
        - $ref: '#/components/schemas/BudgetPolicyInput'
        - type: object
          required: [policy_id, action, updated_at]
          properties:
            policy_id:
              type: string
            updated_at:
              type: string
              format: date-time
    RuntimeControlInput:
      type: object
      additionalProperties: false
      required: [target_type, target_name]
      properties:
        target_type:
          type: string
          enum: [command, tool]
          description: >-
            command approves an exact full command policy key; tool creates an
            exact-name scan exception and does not grant a capability boundary.
        target_name:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^\r\n\u0000]+$'
          description: >-
            Exact single-line command string or tool name after surrounding
            whitespace is removed. Carriage returns, line feeds, and NUL are
            rejected.
          example: git status
        reason:
          type: string
          maxLength: 512
          description: Operator-facing justification stored with the approval.
          example: Read-only repository status
    RuntimeControlEntry:
      type: object
      required: [id, target_type, target_name, reason, updated_at]
      properties:
        id:
          type: string
        target_type:
          type: string
          enum: [command, tool]
        target_name:
          type: string
        reason:
          type: string
        updated_at:
          type: string
          format: date-time
        fixture_backed:
          type: boolean
          description: True only for mutable local rehearsal state.
    RuntimeControlMutationResponse:
      oneOf:
        - $ref: '#/components/schemas/RuntimeControlEntry'
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [allowed, removed]
            target_type:
              type: string
              enum: [command, tool]
            target_name:
              type: string
            fixture_backed:
              type: boolean
    PolicyStudioDraftInput:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Untrusted natural-language security and trust intent. NUL is rejected.
        conversation_id:
          type: string
          maxLength: 128
        previous_draft_id:
          type: string
          format: uuid
          description: Server-held draft to revise within the same conversation.
    PolicyStudioScope:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          type: string
          enum: [fleet, department, agent]
        value:
          type: string
          maxLength: 120
    PolicyStudioRule:
      type: object
      additionalProperties: false
      required: [category, condition, decision, severity, rationale]
      properties:
        category:
          type: string
          enum: [data_protection, identity, model_trust, network_egress, prompt_safety, tool_safety]
        condition:
          type: string
          maxLength: 280
        decision:
          type: string
          enum: [monitor, require_approval, block]
        severity:
          type: string
          enum: [low, medium, high, critical]
        rationale:
          type: string
          maxLength: 280
    PolicyStudioGeneration:
      type: object
      required: [mode, provider, reason]
      properties:
        mode:
          type: string
          enum: [live, fallback]
        provider:
          type: string
        model:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
          enum: [not_configured, provider_unavailable, invalid_provider_draft, fixture_server]
    AgentGuardrailDraftPreview:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, metadata, spec]
      description: Server-owned, non-executable JSON preview. It is not a deployed runtime policy.
      properties:
        apiVersion:
          type: string
          enum: [cloudcontrol.cisco.com/v1alpha1]
        kind:
          type: string
          enum: [AgentGuardrailDraft]
        metadata:
          type: object
          additionalProperties: false
          required: [name, draftId]
          properties:
            name:
              type: string
            draftId:
              type: string
              format: uuid
        spec:
          type: object
          additionalProperties: false
          required: [scope, riskLevel, defaultDecision, rules, exceptions]
          properties:
            scope:
              $ref: '#/components/schemas/PolicyStudioScope'
            riskLevel:
              type: string
              enum: [low, medium, high, critical]
            defaultDecision:
              type: string
              enum: [monitor, require_approval, block]
            rules:
              type: array
              minItems: 1
              maxItems: 6
              items:
                $ref: '#/components/schemas/PolicyStudioRule'
            exceptions:
              type: array
              maxItems: 5
              items:
                type: string
                maxLength: 180
    PolicyStudioDraft:
      type: object
      required:
        - id
        - conversation_id
        - version
        - status
        - created_at
        - name
        - summary
        - scope
        - risk_level
        - mode
        - rules
        - exceptions
        - generation
        - warnings
        - policy
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [generated, staged]
        created_at:
          type: string
          format: date-time
        name:
          type: string
          maxLength: 80
        summary:
          type: string
          maxLength: 320
        scope:
          $ref: '#/components/schemas/PolicyStudioScope'
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        mode:
          type: string
          enum: [monitor, require_approval, block]
        rules:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/PolicyStudioRule'
        exceptions:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 180
        generation:
          $ref: '#/components/schemas/PolicyStudioGeneration'
        warnings:
          type: array
          items:
            type: string
        policy:
          $ref: '#/components/schemas/AgentGuardrailDraftPreview'
        review:
          type: object
          additionalProperties: false
          required: [confirmed, reviewed_at, reviewed_by, identity_verified, evidence_status, reason]
          properties:
            confirmed:
              type: boolean
              enum: [true]
            reviewed_at:
              type: string
              format: date-time
            reviewed_by:
              type: string
              enum: [Unauthenticated demo operator]
            claimed_reviewer:
              type: string
              nullable: true
            identity_verified:
              type: boolean
              enum: [false]
            evidence_status:
              type: string
              enum: [demo_acknowledgement]
            reason:
              type: string
    PolicyStudioDraftResponse:
      type: object
      required: [conversation_id, assistant, draft]
      properties:
        conversation_id:
          type: string
          format: uuid
        assistant:
          type: object
          required: [message]
          properties:
            message:
              type: string
        draft:
          $ref: '#/components/schemas/PolicyStudioDraft'
    PolicyStudioStageInput:
      type: object
      additionalProperties: false
      required: [expected_version, review_confirmed]
      properties:
        expected_version:
          type: integer
          minimum: 1
        review_confirmed:
          type: boolean
          enum: [true]
        reviewed_by:
          type: string
          maxLength: 120
          description: Optional unverified display claim; the server does not treat it as identity evidence.
        reason:
          type: string
          maxLength: 512
    PolicyStudioStageResponse:
      type: object
      required: [draft, application]
      properties:
        draft:
          $ref: '#/components/schemas/PolicyStudioDraft'
        application:
          type: object
          additionalProperties: false
          required: [status, enforcement_status, persistence, review_type, message]
          properties:
            status:
              type: string
              enum: [staged]
            enforcement_status:
              type: string
              enum: [not_enforced]
            persistence:
              type: string
              enum: [ephemeral]
            review_type:
              type: string
              enum: [demo_acknowledgement]
            message:
              type: string
    BudgetAlert:
      type: object
      required:
        - alert_key
        - policy_id
        - agent_id
        - window
        - metric
        - action
        - status
        - observed_value
        - budget_value
      properties:
        alert_key:
          type: string
        policy_id:
          type: string
        agent_id:
          type: string
        agent_name:
          type: string
        session_id:
          type: string
        window:
          type: string
          enum: [session, daily]
        metric:
          type: string
          enum: [tokens, cost_usd]
        action:
          type: string
          enum: [deny, steer]
        status:
          type: string
          enum: [open, resolved, released]
        reason:
          type: string
        observed_value:
          type: number
        budget_value:
          type: number
        first_triggered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
    TokenSummary:
      type: object
      properties:
        total_tokens:
          type: number
        input_tokens:
          type: number
        output_tokens:
          type: number
        cached_tokens:
          type: number
        reasoning_tokens:
          type: number
        tool_tokens:
          type: number
        request_count:
          type: integer
        session_count:
          type: integer
        trace_count:
          type: integer
        active_agents:
          type: integer
          description: Active employee/task agents; resident DefenseClaw is the reporting and enforcement agent.
        cost:
          type: object
          required: [total, input, output, currency, pricing_status]
          properties:
            total:
              type: number
              minimum: 0
            input:
              type: number
              minimum: 0
            output:
              type: number
              minimum: 0
            currency:
              type: string
              enum: [USD]
            pricing_status:
              type: string
              description: >-
                Priced uses source-reported cost; estimated uses a maintained exact-model rate;
                partially_priced means at least one usage row has no mapping.
              enum: [priced, estimated, partially_priced, unpriced]
    TopAgent:
      type: object
      properties:
        agent_name:
          type: string
          description: Employee/task agent name unless runtime_only explicitly describes control-plane evidence.
        service_name:
          type: string
        connector:
          type: string
        tokens:
          type: number
        requests:
          type: integer
        sessions:
          type: integer
        session_ids:
          type: array
          items:
            type: string
        trace_ids:
          type: array
          items:
            type: string
        runtime_only:
          type: boolean
        galileo:
          nullable: true
          $ref: '#/components/schemas/AgentRuntimeSummary'
    TopModel:
      type: object
      properties:
        model:
          type: string
        provider:
          type: string
        tokens:
          type: number
        requests:
          type: integer
        sessions:
          type: integer
    TokenMixRow:
      type: object
      properties:
        token_type:
          type: string
        tokens:
          type: number
        percentage:
          type: number
    Recommendation:
      type: object
      properties:
        title:
          type: string
        why:
          type: string
        action:
          type: string
    RuntimeCard:
      type: object
      properties:
        title:
          type: string
        value:
          type: number
        subtitle:
          type: string
    GalileoSummary:
      type: object
      properties:
        project:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        log_stream:
          type: string
          nullable: true
        log_stream_id:
          type: string
          nullable: true
        trace_count:
          type: integer
        agents_with_runtime_controls:
          type: integer
        runtime_control_events:
          type: integer
        allows:
          type: integer
        denies:
          type: integer
        warns:
          type: integer
        steers:
          type: integer
        logs:
          type: integer
        human_reviews:
          type: integer
        failed_evals:
          type: integer
        agent_summaries:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentRuntimeSummary'
    AgentRuntimeSummary:
      type: object
      properties:
        agent_name:
          type: string
        trace_ids:
          type: array
          items:
            type: string
        session_ids:
          type: array
          items:
            type: string
        runtime_control_events:
          type: integer
        allows:
          type: integer
        denies:
          type: integer
        warns:
          type: integer
        steers:
          type: integer
        logs:
          type: integer
        human_reviews:
          type: integer
        eval_count:
          type: integer
        failed_evals:
          type: integer
        max_severity:
          type: string
        top_reasons:
          type: array
          items:
            type: string
        deep_links:
          type: array
          items:
            type: string
        join_keys:
          type: object
          additionalProperties:
            type: integer
    RuntimeEvidenceRow:
      type: object
      properties:
        agent_name:
          type: string
        decision:
          type: string
          enum: [allow, deny, warn, steer, log, human_review]
        severity:
          type: string
          enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
        reason:
          type: string
        target:
          type: string
        action:
          type: string
        control_id:
          type: string
        policy_id:
          type: string
        evidence_ref:
          type: string
        trace_id:
          type: string
        session_id:
          type: string
        deep_link:
          type: string
        join_key:
          type: string
          enum: [trace_id, session_id, agent_name, agent_name_unmatched]
        token_pressure:
          type: object
          properties:
            tokens:
              type: number
            percentage_of_total:
              type: number
            rank:
              type: integer
              nullable: true
