openapi: 3.0.3
info:
  title: Cisco Cloud Control Agent Tokenomics with Galileo Runtime Governance
  version: 1.0.0
  description: >-
    Cisco Cloud Control-facing tokenomics and budget-control endpoint. The live
    deployment reads DefenseClaw's local usage ledger and applies agent-scoped
    policy to the DefenseClaw enforcement path. Galileo metadata is optional
    server-side enrichment; a future Galileo SaaS control plane can write the
    same policy contract without changing the runtime enforcement API.
servers:
  - url: http://127.0.0.1:8787
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Live dependency readiness
      responses:
        '200':
          description: Ready in live mode, or fixture mode when fallback is explicitly enabled.
          content:
            application/json:
              schema:
                type: object
                required: [status, mode]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  mode:
                    type: string
                    enum: [live, fixture]
                  effective_policy_count:
                    type: integer
        '503':
          description: DefenseClaw is required but unavailable or misconfigured.
  /v1/c3/agent-tokenomics/summary:
    get:
      summary: Cisco Cloud Control Agent Tokenomics summary
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
          example: c3-demo-tenant
        - in: query
          name: workspace_id
          schema:
            type: string
          example: wayne-demo
        - in: query
          name: window
          schema:
            type: string
            default: -24h
        - in: query
          name: include_galileo
          schema:
            type: boolean
            default: false
          description: Attach Galileo runtime controls and eval evidence.
      responses:
        '200':
          description: Live DefenseClaw tokenomics summary, optionally enriched with Galileo metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenomicsResponse'
        '503':
          description: Live DefenseClaw usage is required but unavailable.
  /v1/c3/agent-tokenomics/usage/rows:
    get:
      summary: Normalized live token-usage rows
      parameters:
        - in: query
          name: window
          schema:
            type: string
            default: -24h
      responses:
        '200':
          description: Rows transformed from DefenseClaw budget usage observations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRowsResponse'
        '503':
          description: DefenseClaw usage is unavailable.
  /v1/c3/agent-tokenomics/policies/effective:
    get:
      summary: List stored or effective budget policies
      parameters:
        - in: query
          name: agent_id
          schema:
            type: string
          description: Resolve the exact policy or catch-all policy effective for one agent.
      responses:
        '200':
          description: Effective policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetPolicy'
        '503':
          description: DefenseClaw policy storage is unavailable.
  /v1/c3/agent-tokenomics/alerts:
    get:
      summary: List budget breach alerts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 50
      responses:
        '200':
          description: Open alerts first, followed by resolved or released history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetAlert'
        '400':
          description: Invalid limit.
        '503':
          description: DefenseClaw alert storage is unavailable.
  /v1/c3/agent-tokenomics/controls/apply:
    post:
      summary: Create or replace an agent budget policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPolicyInput'
      responses:
        '200':
          description: Persisted policy after effective-policy resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPolicy'
        '400':
          description: Invalid policy.
        '413':
          description: Request body exceeds 64 KiB.
        '503':
          description: DefenseClaw control is unavailable.
  /v1/c3/agent-tokenomics/controls/release:
    post:
      summary: Delete an agent policy and release all alerts it produced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Policy and associated open alerts released.
        '400':
          description: Invalid release request.
        '413':
          description: Request body exceeds 64 KiB.
        '503':
          description: DefenseClaw control is unavailable.
components:
  schemas:
    AgentTokenomicsResponse:
      type: object
      required:
        - schema_version
        - generated_at
        - source
        - summary
        - top_agents
        - top_models
        - token_mix
        - recommendations
        - deep_links
      properties:
        schema_version:
          type: string
          enum:
            - c3.agent_tokenomics.v0.1
            - c3.agent_tokenomics.v0.2
            - c3.agent_tokenomics.v1
        generated_at:
          type: string
          format: date-time
        source:
          type: string
          enum:
            - splunk_o11y_signalflow
            - splunk_o11y_signalflow+galileo
            - defenseclaw_gateway_ledger
            - fixture_rows
        tenant_id:
          type: string
        workspace_id:
          type: string
        summary:
          $ref: '#/components/schemas/TokenSummary'
        top_agents:
          type: array
          items:
            $ref: '#/components/schemas/TopAgent'
        top_models:
          type: array
          items:
            $ref: '#/components/schemas/TopModel'
        token_mix:
          type: array
          items:
            $ref: '#/components/schemas/TokenMixRow'
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/Recommendation'
        deep_links:
          type: object
          additionalProperties:
            type: string
        galileo:
          $ref: '#/components/schemas/GalileoSummary'
        runtime_governance_cards:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeCard'
        runtime_governance_evidence:
          type: array
          items:
            $ref: '#/components/schemas/RuntimeEvidenceRow'
        runtime_governance_policies:
          type: array
          items:
            $ref: '#/components/schemas/BudgetPolicy'
        executive_banner:
          type: string
    UsageRowsResponse:
      type: object
      required: [source, rows, debug]
      properties:
        generated_at:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          enum: [defenseclaw_gateway_ledger, fixture_rows]
        tenant_id:
          type: string
        workspace_id:
          type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        debug:
          type: object
          additionalProperties: true
    BudgetPolicyInput:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
          minLength: 1
          description: Concrete DefenseClaw agent ID or '*' for a catch-all policy.
        agent_name:
          type: string
        session_token_budget:
          type: integer
          minimum: 1
        daily_token_budget:
          type: integer
          minimum: 1
        session_cost_budget_usd:
          type: number
          format: double
          exclusiveMinimum: 0
        daily_cost_budget_usd:
          type: number
          format: double
          exclusiveMinimum: 0
        action:
          type: string
          enum: [deny, steer]
          default: deny
        updated_by:
          type: string
        source:
          type: string
          description: local today; reserved for Galileo SaaS policy provenance later.
      anyOf:
        - required: [session_token_budget]
        - required: [daily_token_budget]
        - required: [session_cost_budget_usd]
        - required: [daily_cost_budget_usd]
    BudgetPolicy:
      allOf:
        - $ref: '#/components/schemas/BudgetPolicyInput'
        - type: object
          required: [policy_id, action, updated_at]
          properties:
            policy_id:
              type: string
            updated_at:
              type: string
              format: date-time
    BudgetAlert:
      type: object
      required:
        - alert_key
        - policy_id
        - agent_id
        - window
        - metric
        - action
        - status
        - observed_value
        - budget_value
      properties:
        alert_key:
          type: string
        policy_id:
          type: string
        agent_id:
          type: string
        agent_name:
          type: string
        session_id:
          type: string
        window:
          type: string
          enum: [session, daily]
        metric:
          type: string
          enum: [tokens, cost_usd]
        action:
          type: string
          enum: [deny, steer]
        status:
          type: string
          enum: [open, resolved, released]
        reason:
          type: string
        observed_value:
          type: number
        budget_value:
          type: number
        first_triggered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        released_at:
          type: string
          format: date-time
          nullable: true
    TokenSummary:
      type: object
      properties:
        total_tokens:
          type: number
        input_tokens:
          type: number
        output_tokens:
          type: number
        cached_tokens:
          type: number
        reasoning_tokens:
          type: number
        tool_tokens:
          type: number
        request_count:
          type: integer
        session_count:
          type: integer
        trace_count:
          type: integer
        active_agents:
          type: integer
    TopAgent:
      type: object
      properties:
        agent_name:
          type: string
        service_name:
          type: string
        connector:
          type: string
        tokens:
          type: number
        requests:
          type: integer
        sessions:
          type: integer
        session_ids:
          type: array
          items:
            type: string
        trace_ids:
          type: array
          items:
            type: string
        runtime_only:
          type: boolean
        galileo:
          nullable: true
          $ref: '#/components/schemas/AgentRuntimeSummary'
    TopModel:
      type: object
      properties:
        model:
          type: string
        provider:
          type: string
        tokens:
          type: number
        requests:
          type: integer
        sessions:
          type: integer
    TokenMixRow:
      type: object
      properties:
        token_type:
          type: string
        tokens:
          type: number
        percentage:
          type: number
    Recommendation:
      type: object
      properties:
        title:
          type: string
        why:
          type: string
        action:
          type: string
    RuntimeCard:
      type: object
      properties:
        title:
          type: string
        value:
          type: number
        subtitle:
          type: string
    GalileoSummary:
      type: object
      properties:
        project:
          type: string
          nullable: true
        project_id:
          type: string
          nullable: true
        log_stream:
          type: string
          nullable: true
        log_stream_id:
          type: string
          nullable: true
        trace_count:
          type: integer
        agents_with_runtime_controls:
          type: integer
        runtime_control_events:
          type: integer
        allows:
          type: integer
        denies:
          type: integer
        warns:
          type: integer
        steers:
          type: integer
        logs:
          type: integer
        human_reviews:
          type: integer
        failed_evals:
          type: integer
        agent_summaries:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentRuntimeSummary'
    AgentRuntimeSummary:
      type: object
      properties:
        agent_name:
          type: string
        trace_ids:
          type: array
          items:
            type: string
        session_ids:
          type: array
          items:
            type: string
        runtime_control_events:
          type: integer
        allows:
          type: integer
        denies:
          type: integer
        warns:
          type: integer
        steers:
          type: integer
        logs:
          type: integer
        human_reviews:
          type: integer
        eval_count:
          type: integer
        failed_evals:
          type: integer
        max_severity:
          type: string
        top_reasons:
          type: array
          items:
            type: string
        deep_links:
          type: array
          items:
            type: string
        join_keys:
          type: object
          additionalProperties:
            type: integer
    RuntimeEvidenceRow:
      type: object
      properties:
        agent_name:
          type: string
        decision:
          type: string
          enum: [allow, deny, warn, steer, log, human_review]
        severity:
          type: string
          enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
        reason:
          type: string
        target:
          type: string
        action:
          type: string
        control_id:
          type: string
        policy_id:
          type: string
        evidence_ref:
          type: string
        trace_id:
          type: string
        session_id:
          type: string
        deep_link:
          type: string
        join_key:
          type: string
          enum: [trace_id, session_id, agent_name, agent_name_unmatched]
        token_pressure:
          type: object
          properties:
            tokens:
              type: number
            percentage_of_total:
              type: number
            rank:
              type: integer
              nullable: true
