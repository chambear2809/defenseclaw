openapi: 3.0.3
info:
  title: Deskside AI Resilience API
  version: 1.7.0
  description: >-
    Deskside AI Resilience tokenomics, budget-control, and agent-control API for
    Cisco Cloud Control. Each managed AMD Deskside has one resident DefenseClaw
    security agent that reports telemetry and applies local controls for
    separate employee and task agents. The live deployment reads the resident
    agent's usage ledger and applies budget and allow-list policy to its
    enforcement path. The fleet inventory and Cisco ISE/C9350 network-action
    endpoints in this demo are explicitly fixture-backed and simulated. Galileo
    metadata is optional server-side enrichment; a future Galileo SaaS control
    plane can write the same policy contract without changing the runtime
    enforcement API.
    Policy Studio can turn natural-language intent into a constrained,
    non-executable guardrail draft, but staging a reviewed draft never mutates
    live runtime enforcement.
servers:
  - url: http://127.0.0.1:8787
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      summary: Live dependency readiness
      responses:
        '200':
          description: Ready in live mode, or fixture mode when fallback is explicitly enabled.
          content:
            application/json:
              schema:
                type: object
                required: [status, mode]
                properties:
                  status:
                    type: string
                    enum: [ready]
                  mode:
                    type: string
                    enum: [live, fixture]
                  effective_policy_count:
                    type: integer
        '503':
          description: DefenseClaw is required but unavailable or misconfigured.
  /v1/c3/agent-tokenomics/fleet/overview:
    get:
      x-demo-inventory-fixture: true
      summary: Get the simulated AMD Deskside fleet overview
      description: >-
        Returns demo inventory, model-routing, security-policy, and enforcement
        timeline data. Inventory is fixture-backed. Each Deskside has one
        resident DefenseClaw security agent; active_workload_agents and each
        device's active_agents describe separate employee or task agents.
      responses:
        '200':
          description: Simulated fleet overview with an explicit demo disclosure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetOverviewResponse'
        '500':
          description: The fleet demo fixture could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/c3/agent-tokenomics/fleet/analytics:
    get:
      x-demo-analytics-fixture: true
      summary: Get modeled AMD Deskside fleet tokenomics analytics
      description: >-
        Returns the maintained seven-day adoption and modeled-cost scenario used
        by the Tokenomics demo. Employee, department, route, and estimated-cost
        values are modeled and remain separate from the live DefenseClaw
        ledger exposed by the summary and usage-row endpoints.
      responses:
        '200':
          description: Modeled fleet analytics with explicit provenance markers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetAnalyticsResponse'
        '500':
          description: The modeled fleet analytics fixture could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/c3/agent-tokenomics/fleet/infrastructure:
    get:
      x-demo-infrastructure-fixture: true
      summary: Get AMD Deskside infrastructure telemetry aggregated by Splunk Observability
      description: >-
        Returns a production-shaped, deterministic demo contract for CPU,
        memory, GPU, endpoint network, power, and energy telemetry. Every
        fixture value carries explicit quality and Splunk Observability source
        provenance. A device filter recalculates the summary and deterministic
        trend series for the selected device.
      parameters:
        - in: query
          name: window
          schema:
            type: string
            enum: [-1h, -6h, -24h]
            default: -24h
        - in: query
          name: resolution
          schema:
            type: string
            enum: [1h, 6h]
            default: 1h
        - in: query
          name: device_id
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      responses:
        '200':
          description: Infrastructure telemetry with explicit synthetic provenance and freshness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetInfrastructureResponse'
        '400':
          description: Invalid or repeated window, resolution, or device identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The requested device is not present in the infrastructure fixture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The infrastructure fixture could not be loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/c3/agent-tokenomics/fleet/demo/reset:
    post:
      x-demo-simulated: true
      summary: Reset the simulated AMD Deskside demo to its pristine baseline
      description: >-
        Clears mutable in-memory demo state and returns a fresh fleet overview
        loaded from the maintained fixture. This demo-only operation resets
        policy, device, event-timeline, network-action, and restore state. It
        does not change live DefenseClaw, Cisco ISE, or Cisco C9350 state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetDemoResetInput'
      responses:
        '200':
          description: Reset confirmation together with the fresh simulated fleet overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDemoResetResponse'
        '400':
          description: Invalid field, reason, or JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds 64 KiB.
        '500':
          description: The fleet demo fixture could not be reloaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/c3/agent-tokenomics/security/policy:
    post:
      x-demo-simulated: true
      summary: Enable or disable simulated automatic network quarantine
      description: >-
        Updates in-memory demo policy state only. No production Cisco ISE or
        Cisco C9350 system is called. Disabling automatic quarantine prevents
        future simulated actions and does not release existing quarantines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityPolicyUpdateInput'
      responses:
        '200':
          description: Updated or already-matching simulated policy state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityPolicyMutationResponse'
        '400':
          description: Invalid field, value, or JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The expected policy version does not match current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds 64 KiB.
  /v1/c3/agent-tokenomics/fleet/desksides/{device_id}/network-action:
    post:
      x-demo-simulated: true
      summary: Simulate quarantine or restore for one AMD Deskside
      description: >-
        Mutates demo inventory and appends a simulated Cloud Control, Cisco ISE,
        RADIUS CoA, and Cisco C9350 acknowledgement chain. The resident
        DefenseClaw agent remains distinct from employee and task agents on the
        selected device. No production network system is called.
      parameters:
        - in: path
          name: device_id
          required: true
          description: Stable demo AMD Deskside identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkActionInput'
      responses:
        '200':
          description: Idempotent simulated network-action result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkActionResponse'
        '400':
          description: Invalid device identifier, field, value, or JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The demo inventory does not contain the requested Deskside.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds 64 KiB.
  /v1/c3/agent-tokenomics/summary:
    get:
      summary: Deskside AI Resilience tokenomics summary
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
          example: c3-demo-tenant
        - in: query
          name: workspace_id
          schema:
            type: string
          example: wayne-demo
        - in: query
          name: window
          schema:
            type: string
            default: -24h
        - in: query
          name: include_galileo
          schema:
            type: boolean
            default: false
          description: Attach Galileo runtime controls and eval evidence.
      responses:
        '200':
          description: >-
            Tokenomics for workload agents, reported by the resident
            DefenseClaw security agent and optionally enriched with Galileo metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTokenomicsResponse'
        '503':
          description: Live DefenseClaw usage is required but unavailable.
  /v1/c3/agent-tokenomics/usage/rows:
    get:
      summary: Normalized live token-usage rows
      parameters:
        - in: query
          name: window
          schema:
            type: string
            default: -24h
      responses:
        '200':
          description: >-
            Workload-agent rows transformed from observations reported by the
            resident DefenseClaw security agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRowsResponse'
        '503':
          description: DefenseClaw usage is unavailable.
  /v1/c3/agent-tokenomics/policies/effective:
    get:
      summary: List stored or effective budget policies
      parameters:
        - in: query
          name: agent_id
          schema:
            type: string
          description: >-
            Resolve the exact policy or catch-all policy effective for one
            employee/task agent, as enforced by resident DefenseClaw.
      responses:
        '200':
          description: Effective policies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetPolicy'
        '503':
          description: DefenseClaw policy storage is unavailable.
  /v1/c3/agent-tokenomics/agent-controls/allowed:
    get:
      summary: List exact command approvals and tool scan exceptions
      description: >-
        Returns only DefenseClaw allow-list entries whose target type is
        command or tool. Command entries are exact approvals; tool entries are
        exact-name scan exceptions. Skill, plugin, and MCP records remain
        outside this focused operator surface.
      responses:
        '200':
          description: Exact command approvals and exact-name tool scan exceptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeControlEntry'
        '503':
          description: DefenseClaw enforcement storage is unavailable.
  /v1/c3/agent-tokenomics/agent-controls/allow:
    post:
      summary: Create an exact command approval or tool scan exception
      description: >-
        Command approvals match the complete command policy key rather than
        every invocation of the executable. Built-in dangerous-command checks
        run first and cannot be bypassed by this approval. Tool entries skip
        the ordinary scan gate and do not grant workspace, path, network, or
        identity scope. The hook lane retains CodeGuard only for recognized
        write tools with inspectable arguments; the sidecar lane treats the
        entry as a full scan bypass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeControlInput'
      responses:
        '200':
          description: Approval persisted. Clients should refresh the allowed list to confirm current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeControlMutationResponse'
        '400':
          description: Invalid target type, target name, or reason.
        '413':
          description: Request body exceeds 64 KiB.
        '503':
          description: DefenseClaw enforcement storage is unavailable.
  /v1/c3/agent-tokenomics/agent-controls/remove:
    post:
      summary: Remove one exact command approval or tool scan exception
      description: >-
        This Cloud Control-facing POST is translated by the BFF into a DELETE
        against DefenseClaw's authenticated enforcement API. It removes only
        the exact target type and target name supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeControlInput'
      responses:
        '200':
          description: Approval removed. Clients should refresh the allowed list to confirm current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeControlMutationResponse'
        '400':
          description: Invalid target type, target name, or reason.
        '413':
          description: Request body exceeds 64 KiB.
        '503':
          description: DefenseClaw enforcement storage is unavailable.
  /v1/c3/agent-tokenomics/policy-studio/drafts:
    post:
      summary: Generate a constrained agent guardrail draft from natural-language intent
      description: >-
        Uses the configured approved model provider when available and a
        disclosed deterministic template otherwise. Operator text and model
        output are untrusted. The BFF normalizes the result into fixed enums
        and a server-owned AgentGuardrailDraft JSON preview. This endpoint has
        no runtime policy side effects and never accepts executable Rego or YAML.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyStudioDraftInput'
      responses:
        '201':
          description: Server-held guardrail draft generated and validated for operator inspection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyStudioDraftResponse'
        '400':
          description: Invalid, unsupported, or oversized intent field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The referenced previous draft does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The previous draft belongs to another conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds 64 KiB.
        '429':
          description: Policy Studio generation concurrency or per-minute capacity was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/c3/agent-tokenomics/policy-studio/drafts/{draft_id}/apply:
    post:
      summary: Record a demo operator acknowledgment and stage a server-held guardrail draft
      description: >-
        Requires explicit operator acknowledgment and an optimistic version match.
        The server uses its held draft rather than accepting policy JSON from
        the browser. The resulting stage is process-local and explicitly not
        enforced; a separate approved deployment workflow is required to
        change DefenseClaw runtime policy. This demo endpoint has no
        authenticated principal, so its review record is explicitly marked as
        unverified and must not be used as approval evidence.
      parameters:
        - in: path
          name: draft_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyStudioStageInput'
      responses:
        '200':
          description: Demo acknowledgment recorded and draft staged without changing live enforcement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyStudioStageResponse'
        '400':
          description: Review was not confirmed or a field is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The server-held draft does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The draft version is stale or the draft was already staged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body exceeds 64 KiB.
  /v1/c3/agent-tokenomics/alerts:
    get:
      summary: List budget breach alerts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 50
      responses:
        '200':
          description: Open alerts first, followed by resolved or released history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetAlert'
        '400':
          description: Invalid limit.
        '503':
          description: DefenseClaw alert storage is unavailable.
  /v1/c3/agent-tokenomics/controls/apply:
    post:
      summary: Create or replace an agent budget policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPolicyInput'
      responses:
        '200':
          description: Persisted policy after effective-policy resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPolicy'
        '400':
          description: Invalid policy.
        '413':
          description: Request body exceeds 64 KiB.
        '503':
          description: DefenseClaw control is unavailable.
  /v1/c3/agent-tokenomics/controls/release:
    post:
      summary: Delete an agent policy and release all alerts it produced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Policy and associated open alerts released.
        '400':
          description: Invalid release request.
        '413':
          description: Request body exceeds 64 KiB.
        '503':
          description: DefenseClaw control is unavailable.
components:
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string
        device_id:
          type: string
      additionalProperties: true
    FleetOverviewResponse:
      type: object
      required:
        - schema_version
        - generated_at
        - source
        - fleet
        - network_topology
        - model_routes
        - security_policy
        - integrations
        - devices
        - enforcement_events
        - demo
      properties:
        schema_version:
          type: string
          enum: [c3.amd_deskside_fleet.v1]
        generated_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [amd_deskside_demo_inventory]
        fleet:
          $ref: '#/components/schemas/FleetSummary'
        network_topology:
          $ref: '#/components/schemas/NetworkTopology'
        model_routes:
          type: array
          items:
            $ref: '#/components/schemas/ModelRoute'
        security_policy:
          $ref: '#/components/schemas/SecurityPolicy'
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/FleetIntegration'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DesksideDevice'
        enforcement_events:
          type: array
          items:
            $ref: '#/components/schemas/NetworkEnforcementEvent'
        demo:
          $ref: '#/components/schemas/FleetDemoDisclosure'
    NetworkTopology:
      type: object
      additionalProperties: false
      description: >-
        Fixture-backed reference campus architecture. This object identifies
        the intended C9550 core and C9350 access roles; it is not discovered
        production inventory and its capability labels are not observed
        telemetry.
      required: [architecture, core, access]
      properties:
        architecture:
          type: string
          enum: [reference-campus]
        core:
          $ref: '#/components/schemas/NetworkTopologyCore'
        access:
          $ref: '#/components/schemas/NetworkTopologyAccess'
    NetworkTopologyCore:
      type: object
      additionalProperties: false
      required:
        - display_name
        - official_model
        - role
        - deployment
        - message
        - capabilities
      properties:
        display_name:
          type: string
          enum: [Cisco C9550]
        official_model:
          type: string
          enum: [Cisco C9550 Series Smart Switches]
          description: Official Cisco series name used by this reference architecture.
        role:
          type: string
          enum: [Core + aggregation]
        deployment:
          type: string
          enum: [Logical core pair]
          description: >-
            One logical core tier represented by a resilient pair; this is a
            design statement, not live device-count telemetry.
        message:
          type: string
          enum: [Campus backbone for agentic AI]
        capabilities:
          $ref: '#/components/schemas/NetworkTopologyCoreCapabilities'
    NetworkTopologyCoreCapabilities:
      type: object
      additionalProperties: false
      description: >-
        Published C9550 series maxima for reference-design context. These are
        not measured capacity, current utilization, or guarantees for every SKU.
      required: [switching_capacity, uplink_speed]
      properties:
        switching_capacity:
          type: object
          additionalProperties: false
          required: [label, basis]
          properties:
            label:
              type: string
              enum: [Up to 6.4 Tbps]
            basis:
              type: string
              enum: [series-maximum]
              description: Published series maximum; never observed telemetry.
        uplink_speed:
          type: object
          additionalProperties: false
          required: [label, basis]
          properties:
            label:
              type: string
              enum: [Up to 400G]
            basis:
              type: string
              enum: [series-maximum]
              description: Published series maximum; never observed telemetry.
    NetworkTopologyAccess:
      type: object
      additionalProperties: false
      required:
        - display_name
        - official_model
        - role
        - switch_count
        - capabilities
      properties:
        display_name:
          type: string
          enum: [Cisco C9350]
        official_model:
          type: string
          enum: [Cisco C9350 Series Smart Switches]
          description: Official Cisco series name used by this reference architecture.
        role:
          type: string
          enum: [Fixed campus access]
        switch_count:
          type: integer
          minimum: 1
          description: Number of access-switch nodes represented by the demo fixture.
        capabilities:
          $ref: '#/components/schemas/NetworkTopologyAccessCapabilities'
    NetworkTopologyAccessCapabilities:
      type: object
      additionalProperties: false
      description: >-
        Published C9350 series maximum for reference-design context. This is
        not measured uplink speed or a guarantee for every SKU or configuration.
      required: [uplink_speed]
      properties:
        uplink_speed:
          type: object
          additionalProperties: false
          required: [label, basis]
          properties:
            label:
              type: string
              enum: [Up to 100G]
            basis:
              type: string
              enum: [series-maximum]
              description: Published series maximum; never observed telemetry.
    FleetAnalyticsResponse:
      type: object
      required:
        - schema_version
        - generated_at
        - source
        - debug
        - scope
        - disclosure
        - dimensions
        - adoption
        - cost
      properties:
        schema_version:
          type: string
          enum: [c3.agent_tokenomics.fleet_analytics.v1]
        generated_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [amd_deskside_demo_scenario]
        debug:
          type: object
          required: [fixture_backed]
          properties:
            fixture_backed:
              type: boolean
              enum: [true]
          additionalProperties: true
        scope:
          $ref: '#/components/schemas/FleetAnalyticsScope'
        disclosure:
          $ref: '#/components/schemas/FleetAnalyticsDisclosure'
        dimensions:
          $ref: '#/components/schemas/FleetAnalyticsDimensions'
        adoption:
          $ref: '#/components/schemas/FleetAdoptionAnalytics'
        cost:
          $ref: '#/components/schemas/FleetCostAnalytics'
    FleetInfrastructureResponse:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - generated_at
        - source
        - debug
        - disclosure
        - scope
        - fleet_summary
        - devices
        - series
      properties:
        schema_version:
          type: string
          enum: [c3.agent_tokenomics.fleet_infrastructure.v1]
        generated_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [splunk_o11y_synthetic_demo]
        debug:
          $ref: '#/components/schemas/FleetInfrastructureDebug'
        disclosure:
          $ref: '#/components/schemas/FleetInfrastructureDisclosure'
        scope:
          $ref: '#/components/schemas/FleetInfrastructureScope'
        fleet_summary:
          $ref: '#/components/schemas/FleetInfrastructureSummary'
        devices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FleetInfrastructureDevice'
        series:
          $ref: '#/components/schemas/FleetInfrastructureSeries'
    FleetInfrastructureDebug:
      type: object
      additionalProperties: true
      required: [fixture_backed, synthetic, requested_filters]
      properties:
        fixture_backed:
          type: boolean
          enum: [true]
        synthetic:
          type: boolean
          enum: [true]
        requested_filters:
          $ref: '#/components/schemas/FleetInfrastructureRequestedFilters'
    FleetInfrastructureRequestedFilters:
      type: object
      additionalProperties: false
      required: [window, resolution, device_id]
      properties:
        window:
          type: string
          enum: [-1h, -6h, -24h]
        resolution:
          type: string
          enum: [1h, 6h]
        device_id:
